<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>COC Time Export</title>
</head>
<body>
<textarea id="input"></textarea>
<textarea id="output"></textarea>

<button onclick="exportTime()">Xuất</button>
<script>

const buildingMap = {
    1000000:"army",
    1000001:"town",
    1000002:"rco",
    1000003:"rst",
    1000004:"dmi",
    1000005:"dst",
    1000006:"barr",
    1000007:"lab",
    1000008:"can",
    1000009:"rto",
    1000011:"rdt",
    1000012:"rde",
    1000013:"mor",
    1000014:"clan",
    1000019:"nte",
    1000020:"fac",
    1000021:"bow",
    1000023:"darkelixird",
    1000024:"darkelixirst",
    1000026:"darkbarr",
    1000027:"fer",
    1000028:"rsw",
    1000029:"darkspell",
    1000031:"gle",
    1000032:"bto",
    1000059:"rks",
    1000067:"ter",
    1000068:"eth",
    1000070:"acksm",
    1000071:"hero",
    1000072:"ellt",
    1000077:"nol",
    1000093:"der"
};

const accountMap = {
    "#R0V0P2QRL": 0,
    "#GCL0UCPYU": 1,
    "#R9RRYVJLY": 2,
    "#GUC8YLLCQ": 3,
    "#GG99VG02P": 4,
    "#GQQQ2QR02": 5,
    "#R28PGJR2Q": 6,
    "#R9RRL98JV": 7,
    "#GG99VJGRP": 8,
    "#R28Q9L9PP": 9
};

function splitObjects(text) {

    const result = [];

    let depth = 0;
    let start = -1;

    for (let i = 0; i < text.length; i++) {

        if (text[i] === "{") {

            if (depth === 0) {
                start = i;
            }

            depth++;
        }

        else if (text[i] === "}") {

            depth--;

            if (depth === 0 && start !== -1) {

                result.push(
                    text.substring(start, i + 1)
                );
            }
        }
    }

    return result;
}

function addBuildingLevels(arr, map) {

    if (!Array.isArray(arr)) return;

    arr.forEach(item => {

        const name =
            buildingMap[item.data];

        if (!name) return;

        if (item.data === 1000001) {

            map[name] = item.lvl;
            return;
        }

        if (!item.cnt) return;

        if (!map[name]) {
            map[name] = [];
        }

        for (
            let i = 0;
            i < item.cnt;
            i++
        ) {
            map[name].push(item.lvl);
        }
    });
}

function addTimers(
    arr,
    timestamp,
    result
) {

    if (!Array.isArray(arr)) return;

    arr.forEach(item => {

        if (!item.timer) return;

        const name =
            buildingMap[item.data];

        if (!name) return;

        result.push([
            name,
            String(
                (timestamp + item.timer)
                * 1000
            ),
            (item.lvl || 0) + 1
        ]);
    });
}

function exportTime() {

    try {

        const input =
            document
            .getElementById("input")
            .value
            .trim();

        const objects =
            splitObjects(input);

        const outputs = [];

        objects.forEach(text => {

            const obj =
                JSON.parse(text);

            const accountId =
                accountMap[obj.tag];

            if (
                accountId === undefined
            ) {

                outputs.push(
                    `// Không tìm thấy account ${obj.tag}`
                );

                return;
            }

            const buildMap = {};
            const timeList = [];

            addBuildingLevels(
                obj.buildings,
                buildMap
            );

            addTimers(
                obj.buildings,
                obj.timestamp,
                timeList
            );

            Object.entries(buildMap)
            .forEach(
                ([key, value]) => {

                    outputs.push(
                        `accountBuildList[${accountId}].put("${key}", ${JSON.stringify(value)})`
                    );
                }
            );

            outputs.push(
                `accountBuildList[${accountId}].put("time", ${JSON.stringify(timeList)})`
            );

            outputs.push("");
        });

        document
        .getElementById("output")
        .value =
            outputs.join("\n");

    }

    catch (e) {

        document
        .getElementById("output")
        .value =
            "JSON lỗi:\n" +
            e.message;
    }
}

</script>
</body>
</html>
