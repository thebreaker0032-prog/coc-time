<!DOCTYPE html>
<html lang="vi">
<!--  -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thời Gian Đến</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.19.3/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 12px;
            background: #1e1e1e;
            color: #e0e0e0;
        }

        h2 {
            font-size: 20px;
            text-align: center;
            color: #fff;
            margin-bottom: 10px;
        }

        input,
        select,
        button {
            font-size: 18px;
            padding: 10px 12px;
            margin: 4px;
            background-color: #2d2d2d;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 8px;
            margin: 10px 0;
        }

        .action-buttons button {
            flex: 1;
            min-width: 90px;
            background: #3a3a3a;
            transition: background 0.2s;
        }

        .action-buttons button:hover {
            background: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #2a2a2a;
            font-size: 16px;
        }

        th,
        td {
            border: 1px solid #444;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #333;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #242424;
        }

        .remove-btn {
            background: #444;
            color: #eee;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            padding: 4px 6px;
        }

        .table-container {
            overflow-x: auto;
            max-height: 60vh;
        }

        .bottom-buttons {
            margin-top: 12px;
            display: flex;
            justify-content: center;
        }

        @media print {
            body {
                background: white;
                color: black;
            }

            .action-buttons,
            .bottom-buttons,
            input,
            select,
            #addBtn {
                display: none;
            }
        }

        .reuse-btn {
            background-color: #3a3a3a;
            color: #fff;
            border: 1px solid #555;
            border-radius: 5px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .reuse-btn:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <h2>⏱️ Tính thời gian đến</h2>

    <textarea id="cocInput" style="
        width:100%;
        height:180px;
        background:#2d2d2d;
        color:white;
        margin-bottom:10px;
    " placeholder="Paste JSON Clash of Clans vào đây">
</textarea>

    <div class="action-buttons">

            <option value="">🔍 Tất cả Hall</option>

        const halls = Object.values(accountMap)
            .sort((a, b) => a - b)
            .map(val => ({ name: String(val + 1) }));
        function splitObjects(text) {
            const result = [];
            let depth = 0;
            let start = -1;
            for (let i = 0; i < text.length; i++) {
                if (text[i] === "{") {
                    if (depth === 0) {
                        start = i;
                    }
                    depth++;
                }
                else if (text[i] === "}") {
                    depth--;
                    if (depth === 0 && start !== -1) {
                        result.push(
                            text.substring(start, i + 1)
                        );
                    }
                }
            }
            return result;
        }
        const upgradeTarget = {
            can: 4,
            rto: 4,
        };
        function addBuildingLevels(arr, map) {
            if (!Array.isArray(arr)) return;
            arr.forEach(item => {
                const name = buildingMap[item.data];
                if (!name) return;
                if (item.data === 1000001) {
                    map[name] = item.lvl;
                    return;
                }
                if (item.cnt != null) {
                    if (!map[name]) {
                        map[name] = [];
                    }
                    for (let i = 0; i < item.cnt; i++) {
                        map[name].push(
                            item.lvl || 0
                        );
                    }
                    return;
                }
                if (item.data >= 28000000 && item.data <= 28000007) {
                    if (item.timer) {
                        map[name] = [];
                    } else {
                        map[name] = [item.lvl || 0];
                    }
                    return;
                }
            });
        }
        function addTimers(arr, timestamp, result) {
            if (!Array.isArray(arr)) return;
            arr.forEach(item => {
                if (!item.timer) return;
                const name = buildingMap[item.data];
                if (!name) return;
                result.push([name, String((timestamp + item.timer) * 1000), (item.lvl || 0) + 1]);
            });
        }
        function addUpgradeList(buildMap) {
            const th = buildMap.town || 1;
            const upgradeList = [];
            Object.entries(upgradeTarget).forEach(([name, count]) => {
                const levels = buildMap[name];
                if (!Array.isArray(levels)) return;
                const table = maxLevelByTH[name];
                if (!table) return;
                const maxLevel = table[Math.min(th, table.length - 1)];
                if (maxLevel <= 0) return;
                const selectLevels = [...levels].filter(level => level < maxLevel).sort((a, b) => b - a).slice(0, count);
                selectLevels.forEach(level => {
                    for (let lv = level + 1; lv <= maxLevel; lv++) {
                        upgradeList.push(`${name}-${lv}`);
                    }
                });
            });
            buildMap.upgrade = upgradeList;
        }
        function exportTime() {
            try {
                const input = document.getElementById("input").value.trim();
                const objects = splitObjects(input);
                const outputs = [];
                objects.forEach(text => {
                    const obj = JSON.parse(text);
                    const accountId = accountMap[obj.tag];

                    if (accountId === undefined) {
                        outputs.push(`// Không tìm thấy account ${obj.tag}`);
                        return;
                    }
                    const buildMap = {};
                    const timeList = [];
                    addBuildingLevels(obj.buildings, buildMap);
                    addBuildingLevels(obj.heroes, buildMap);
                    addTimers(obj.buildings, obj.timestamp, timeList);
                    addTimers(obj.heroes, obj.timestamp, timeList);
                    Object.entries(buildMap).forEach(([key, value]) => {
                        outputs.push(`accountBuildList[${accountId}].put("${key}", ${JSON.stringify(value)})`);
                    });
                    outputs.push(`accountBuildList[${accountId}].put("time", ${JSON.stringify(timeList)})`);
                    outputs.push("");
                });
                document
                    .getElementById("output")
                    .value =
                    outputs.join("\n");

            }

            catch (e) {

                document
                    .getElementById("output")
                    .value =
                    "JSON lỗi:\n" +
                    e.message;
            }
        }
        function exportAccountBuildList(input) {

            const objects = splitObjects(input);
            const outputs = [];

            objects.forEach(text => {

                const obj = JSON.parse(text);

                const accountId = accountMap[obj.tag];

                if (accountId === undefined) {
                    outputs.push(`// Không tìm thấy account ${obj.tag}`);
                    return;
                }

                const buildMap = {};
                const timeList = [];

                addBuildingLevels(obj.buildings, buildMap);
                addBuildingLevels(obj.heroes, buildMap);

                addTimers(obj.buildings, obj.timestamp, timeList);
                addTimers(obj.heroes, obj.timestamp, timeList);

                // addUpgradeList(buildMap);

                Object.entries(buildMap).forEach(([key, value]) => {
                    outputs.push(
                        `accountBuildList[${accountId}].put("${key}", ${JSON.stringify(value)})`
                    );
                });

                outputs.push(
                    `accountBuildList[${accountId}].put("time", ${JSON.stringify(timeList)})`
                );

                outputs.push("");
            });

            return outputs.join("\n");
        }
        function hasLabWasteWarning(obj) {
            const helperCooldown = obj.helpers?.[0]?.helper_cooldown || 0;
            if (!helperCooldown) return false;
            const researches = [...(obj.units || []), ...(obj.spells || []), ...(obj.siege_machines || [])];
            return researches.some(item => {
                if (!item.timer || item.helper_recurrent !== true) return false;
                const remainAfterTrigger = item.timer - helperCooldown;
                return (remainAfterTrigger > 0 && remainAfterTrigger < 7200);
            });
        }
        function pad(n) {
            return String(n).padStart(2, " ");
        }
        function apply4xBoost(timer, boost) {
            const boostedTime = Math.min(boost, Math.ceil(timer / 4));
            return (timer - boostedTime * 4 + boostedTime);
        }
        function apply2xBoost(timer, boostSeconds) {
            if (boostSeconds <= 0) return timer;
            const boosted = boostSeconds * 2;
            if (boosted >= timer) {
                return Math.ceil(timer / 2);
            }
            return boostSeconds + (timer - boosted);
        }
        function apply10xBoost(timer, boost) {
            const boostedTime = Math.min(boost, Math.ceil(timer / 10));
            return (timer - boostedTime * 10 + boostedTime);
        }
        function apply24xBoost(timer, boostSeconds) {
            if (boostSeconds <= 0) return timer;
            const boosted = boostSeconds * 24;
            if (boosted >= timer) {
                return Math.ceil(timer / 24);
            }
            return boostSeconds + (timer - boosted);
        }
        function updateFilterWarnings() {
            const now = Date.now();
            const currentValue = filterSelect.value;
            filterSelect.innerHTML = `<option value="">🔍 Tất cả Hall</option>` +
                halls.map(h => {
                    const hallEntries = entries.filter(e => e.hall === h.name && e.timestamp > now);
                    const builderCount = hallEntries.filter(e => e.type === "builder hall").length;
                    const labCount = hallEntries.filter(e => e.type === "lab").length;
                    const speedBuilderCount = hallEntries.filter(e => e.type === "speed builder hall").length;
                    const speedLabCount = hallEntries.filter(e => e.type === "speed lab").length;
                    const petCount = hallEntries.filter(e => e.type === "pet").length;
                    const normalCount = hallEntries.filter(e => e.type === "normal").length;
                    let text = `${h.name.padStart(9, " ")} | `;
                    if (normalCount) text += `🏗️${pad(normalCount)} | `;
                    if (builderCount) text += `🔨${pad(builderCount)} | `;
                    if (labCount) text += `🧪${pad(labCount)} | `;
                    if (petCount) text += `🐾${pad(petCount)} | `;
                    if (speedBuilderCount) text += `⚡${pad(speedBuilderCount)} | `;
                    if (speedLabCount) text += `🚀${pad(speedLabCount)}`;
                    if (hallWarnings && hallWarnings[h.name]?.helperWaste) text += " 🚨";
                    if (hallWarnings[h.name]?.labBoostWaste || hallWarnings[h.name]?.petBoostWaste || hallWarnings[h.name]?.builderBoostWaste || hallWarnings[h.name]?.labConsumableWaste || hallWarnings[h.name]?.builder10BoostWaste || hallWarnings[h.name]?.wastedClockTowerBoost) text += " ⚠️";
                    return `<option value="${h.name}">${text}</option>`;
                }).join("");
            filterSelect.value = currentValue;
        }
        filterSelect.innerHTML = `<option value="">🔍 Tất cả Hall</option>` + halls.map(h => `<option value="${h.name}">${h.name}</option>`).join('');
        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        }
        function loadFromStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                entries = JSON.parse(saved);
                renderTable();
            }
        }
        function addEntry(hall, type, timestamp) {
            const d = new Date(timestamp);
            entries.push({
                id: Date.now().toString(36) + Math.random().toString(36).slice(2),
                timestamp,
                dateString: d.toLocaleDateString("vi-VN"),
                hh: d.getHours().toString().padStart(2, "0"),
                mm: d.getMinutes().toString().padStart(2, "0"),
                hall,
                type
            });
        }
        function parseTimeInput(value) {
            const val = value.trim();
            if (!/^\d{1,6}$/.test(val)) return 0;
            if (val.length <= 2) return parseInt(val, 10);
            if (val.length <= 4) {
                const padded = val.padStart(4, '0');
                const h = parseInt(padded.slice(0, -2), 10);
                const m = parseInt(padded.slice(-2), 10);
                return h * 60 + m;
            }
            const padded = val.padStart(6, '0');
            const d = parseInt(padded.slice(0, -4), 10);
            const h = parseInt(padded.slice(-4, -2), 10);
            const m = parseInt(padded.slice(-2), 10);
            return d * 24 * 60 + h * 60 + m;
        }
        function formatTimeRemaining(entry) {
            const diffMs = entry.timestamp - Date.now();
            if (diffMs <= 0) return "⏰ 00:00";
            let totalMinutes = Math.floor(diffMs / 60000);
            const days = Math.floor(totalMinutes / (24 * 60));
            totalMinutes %= 24 * 60;
            const hours = Math.floor(totalMinutes / 60);
            const mins = totalMinutes % 60;
            if (days > 0) return `${days}:${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
            return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
        }
        function handleInput() {
            const value = input.value.trim();
            const hall = hallSelect.value;
            const type = typeSelect.value;
            if (!/^\d{1,6}$/.test(value)) {
                input.value = '';
                input.focus();
                return;
            }
            // === Phần thêm thời gian bình thường ===
            const now = new Date();
            const totalMinutes = parseTimeInput(value);
            const future = new Date(now.getTime() + totalMinutes * 60000);

            const entry = {
                id: Date.now().toString(36) + Math.random().toString(36).slice(2),
                timestamp: future.getTime(),
                dateString: future.toLocaleDateString('vi-VN'),
                hh: future.getHours().toString().padStart(2, '0'),
                mm: future.getMinutes().toString().padStart(2, '0'),
                type,
                hall
            };

            const twoMinutes = 2 * 60000;
            const tooClose = entries.some(e => e.hall === entry.hall && Math.abs(e.timestamp - entry.timestamp) <= twoMinutes);
            if (tooClose) return;

            entries.push(entry);
            saveToStorage();
            renderTable();

            input.value = '';
            input.focus();
        }

        function renderTable() {
            const selectedHall = filterSelect.value;
            const now = Date.now();

            const filtered = entries
                .filter(e => !selectedHall || e.hall === selectedHall)
                .sort((a, b) => a.timestamp - b.timestamp);

            tableBody.innerHTML = '';
            filtered.forEach((entry, index) => {
                const row = document.createElement('tr');
                const diff = entry.timestamp - now;
                let color = "#e0e0e0";
                if (diff < 0) color = "#ff6b6b";
                else if (diff <= 10 * 60000) color = "#ffd166";

                let timeCellContent = "";
                if (diff > 0) timeCellContent = formatTimeRemaining(entry);
                row.innerHTML = `
        <td>${index + 1}</td>
        <td>${entry.dateString}</td>
        <td>${entry.hh}:${entry.mm}</td>
        <td>${entry.hall}</td>
        <td>${entry.type}</td>
        <td>${timeCellContent}</td>
        <td><button class="remove-btn" onclick="removeEntry('${entry.id}')">✕</button></td>
      `;
                row.style.color = color;
                tableBody.appendChild(row);
            });
            updateFilterWarnings();
        }
        function renderFilterSelect() {

            const select =
                document.getElementById(
                    "filterSelect"
                );

            const currentValue =
                select.value;

            select.innerHTML =
                '<option value="">Tất cả</option>';

            halls.forEach(hall => {

                const option =
                    document.createElement("option");

                option.value = hall;

                option.textContent =
                    warningHalls.has(hall)
                        ? `⚠️ ${hall}`
                        : hall;

                select.appendChild(option);
            });

            select.value = currentValue;
        }
        function removeEntry(id) {
            entries = entries.filter(e => e.id !== id);
            saveToStorage();
            renderTable();
        }
        window.removeEntry = removeEntry;
        function reuseEntry(id) {
            const entry = entries.find(e => e.id === id);
            if (!entry) return;

            hallSelect.value = entry.hall;
            typeSelect.value = entry.type;
            input.focus();

            // Nếu muốn tự động xoá dòng cũ khi nhấn, bỏ comment dòng dưới:
            // removeEntry(id);
        }
        window.reuseEntry = reuseEntry;



        filterSelect.addEventListener('change', () => {
            renderTable();
            hallSelect.value = filterSelect.value || halls[0].name;
        });

        function applyFutureClockTower(
            buildTimerSec,
            clockCooldownSec,
            clockLevel
        ) {

            if (!clockLevel) {
                return buildTimerSec;
            }

            const boostSec =
                ((clockLevel * 2 + 12) * 9) * 60;

            let remaining = buildTimerSec;
            let nextBoost = clockCooldownSec;

            while (nextBoost < remaining) {

                remaining -= boostSec;

                if (remaining <= 0) {
                    return 0;
                }

                nextBoost += 22 * 3600;
            }

            return remaining;
        }
        function applyFutureResearchAssistant(
            labTimerSec,
            helperCooldownSec
        ) {

            let remaining = labTimerSec;
            let nextUse = helperCooldownSec;

            const reduceSec = 3600;      // 1h
            const loopSec = 24 * 3600;   // 24h
            const minWorthSec = 2 * 3600; // <2h thì bỏ

            while (nextUse < remaining) {

                const labRemainingAtUse =
                    remaining - nextUse;

                // Nếu lúc assistant sẵn sàng mà lab
                // chỉ còn dưới 2h thì bỏ qua
                if (labRemainingAtUse < minWorthSec) {
                    break;
                }

                remaining -= reduceSec;

                if (remaining <= 0) {
                    return 0;
                }

                nextUse += loopSec;
            }

            return remaining;
        }
        function processCOCObject(obj) {
            const hall = accountMap[obj.tag] + 1;

            warningHalls.delete(hall);
            const builderBoost = obj.boosts?.builder_consumable || 0;
            const builderBoost10 = obj.boosts?.builder_boost || 0;
            let wastedBuilderBoost = false;
            let wastedBuilder10Boost = false;
            if (hasLabWasteWarning(obj)) {
                warningHalls.add(hall);
            }
            hallWarnings[hall] = {
                helperWaste: false
            };
            if (!hall) {
                console.warn(
                    "Không tìm thấy hall:",
                    obj.tag
                );
                return;
            }

            // Xóa dữ liệu COC cũ của hall
            entries = entries.filter(e =>
                e.hall !== hall ||
                ![
                    "normal",
                    "builder hall",
                    "lab",
                    "pet",
                    "speed lab",
                    "speed builder hall"
                ].includes(e.type)
            );

            const baseTime =
                obj.timestamp * 1000;

            // =====================================================
            // CLOCK TOWER
            // =====================================================

            const clockTower =
                (obj.buildings2 || [])
                    .find(b => b.data === 1000039);

            const clockCooldown =
                obj.boosts?.clocktower_cooldown || 0;

            const clockTowerUpgrading =
                !!clockTower?.timer;
            const clockTowerBoost = obj.boosts?.clocktower_boost || 0;
            let wastedClockTowerBoost = false;
            const normalItems = [
                ...(obj.buildings || []),
                ...(obj.traps || []),
                ...(obj.heroes || [])
            ];
            normalItems.forEach(item => {
                if (!item.timer) return;
                let remaining = item.timer;
                if (builderBoost10 > 0) {
                    const finishDuringBoost = Math.ceil(remaining / 10);
                    if (finishDuringBoost < builderBoost10) {
                        wastedBuilder10Boost = true;
                    }
                    remaining = apply10xBoost(remaining, builderBoost10);
                }
                if (builderBoost > 0) {
                    const finishDuringConsumable = Math.ceil(remaining / 2);
                    if (finishDuringConsumable < builderBoost) {
                        wastedBuilderBoost = true;
                    }
                    remaining = apply2xBoost(remaining, builderBoost);
                }
                addEntry(hall, "normal", baseTime + remaining * 1000);

            });
            // =====================================================
            // BUILDER HALL
            // =====================================================

            const builderTimers = [
                ...(obj.buildings2 || []),
                ...(obj.heroes2 || []),
                ...(obj.units2 || [])
            ];

            builderTimers.forEach(item => {

                if (!item.timer) return;

                let remaining = item.timer;

                if (clockTowerBoost > 0) {

                    const finishDuringBoost =
                        Math.ceil(remaining / 10);

                    if (finishDuringBoost < clockTowerBoost) {
                        wastedClockTowerBoost = true;
                    }

                    remaining = apply10xBoost(
                        remaining,
                        clockTowerBoost
                    );
                }

                addEntry(
                    hall,
                    "builder hall",
                    baseTime + remaining * 1000
                );
            });

            // =====================================================
            // LAB (units + spells + siege_machines)
            // =====================================================

            const helper = obj.helpers?.find(h => h.lvl > 0);

            const helperCooldown =
                helper?.helper_cooldown ?? 0;

            const helperFinishTime =
                baseTime +
                helperCooldown * 1000;

            const labResearches = [
                ...(obj.units || []),
                ...(obj.spells || []),
                ...(obj.siege_machines || [])
            ];
            const petResearches = [
                ...(obj.pets || [])
            ];
            const hasRecurringHelper =
                labResearches.some(
                    item =>
                        item.timer &&
                        item.helper_recurrent === true
                );

            const recurringResearch =
                labResearches.find(
                    item =>
                        item.timer &&
                        item.helper_recurrent === true
                );

            // Cảnh báo Apprentice Researcher sắp bị lãng phí
            if (
                recurringResearch &&
                helperCooldown > 0
            ) {

                const remainAfterTrigger =
                    recurringResearch.timer -
                    helperCooldown;

                if (
                    remainAfterTrigger > 0 &&
                    remainAfterTrigger < 7200
                ) {
                    hallWarnings[hall].helperWaste = true;
                }
            }
            const labBoost = obj.boosts?.lab_boost || 0;
            const petBoost = obj.boosts?.pet_boost || 0;
            const labConsumable = obj.boosts?.lab_consumable || 0;
            let wastedLabBoost = false;
            let wastedPetBoost = false;
            let wastedLabConsumable = false;
            labResearches.forEach(item => {
                if (!item.timer) return;

                let remaining = item.timer;
                if (labBoost > 0) {
                    const finishDuringBoost = Math.ceil(remaining / 24);
                    if (finishDuringBoost < labBoost) {
                        wastedLabBoost = true;
                    }
                    remaining = apply24xBoost(remaining, labBoost);
                }
                if (labConsumable > 0) {
                    const finishDuringConsumable = Math.ceil(remaining / 4);
                    if (finishDuringConsumable < labConsumable) {
                        wastedLabConsumable = true;
                    }
                    remaining = apply4xBoost(remaining, labConsumable);
                }
                // Apprentice Researcher auto chạy
                if (
                    item.helper_recurrent === true &&
                    helperCooldown > 0
                ) {

                    let nextCooldown =
                        helperCooldown;

                    while (
                        nextCooldown < remaining
                    ) {

                        const remainAfterTrigger =
                            remaining -
                            nextCooldown;

                        // tránh lãng phí
                        if (
                            remainAfterTrigger < 7200
                        ) {
                            break;
                        }

                        remaining -= 3600;

                        nextCooldown +=
                            24 * 3600;
                    }
                }

                addEntry(hall, "lab", baseTime + remaining * 1000);
            });
            petResearches.forEach(item => {
                if (!item.timer) return;
                let remaining = item.timer;
                if (petBoost > 0) {
                    const finishDuringBoost = Math.ceil(remaining / 24);
                    if (finishDuringBoost < petBoost) {
                        wastedPetBoost = true;
                    }
                    remaining = apply24xBoost(remaining, petBoost);
                }
                if (labConsumable > 0) {
                    const finishDuringConsumable = Math.ceil(remaining / 4);
                    if (finishDuringConsumable < labConsumable) {
                        wastedLabConsumable = true;
                    }
                    remaining = apply4xBoost(remaining, labConsumable);
                }
                addEntry(hall, "pet", baseTime + remaining * 1000);
            });
            hallWarnings[hall] ??= {};
            hallWarnings[hall].builderBoostWaste = wastedBuilderBoost;
            hallWarnings[hall].labBoostWaste = wastedLabBoost;
            hallWarnings[hall].petBoostWaste = wastedPetBoost;
            hallWarnings[hall].labConsumableWaste = wastedLabConsumable;
            hallWarnings[hall].builder10BoostWaste = wastedBuilder10Boost;
            hallWarnings[hall].wastedClockTowerBoost = wastedClockTowerBoost;
            // =====================================================
            // SPEED LAB
            // Chỉ hiện nếu không có research nào
            // đang bật helper_recurrent
            // =====================================================

            if (!hasRecurringHelper) {
                addEntry(hall, "speed lab", helperFinishTime);
            }

            // =====================================================
            // SPEED BUILDER HALL
            // =====================================================

            if (clockCooldown > 0) {

                addEntry(
                    hall,
                    "speed builder hall",
                    baseTime +
                    clockCooldown * 1000
                );
            }
        }
        function splitJSONObjects(text) {

            const objects = [];

            let depth = 0;
            let start = -1;

            for (let i = 0; i < text.length; i++) {

                const ch = text[i];

                if (ch === "{") {

                    if (depth === 0)
                        start = i;

                    depth++;
                }
                else if (ch === "}") {

                    depth--;

                    if (depth === 0 && start !== -1) {

                        objects.push(
                            text.slice(start, i + 1)
                        );

                        start = -1;
                    }
                }
            }

            return objects;
        }

        function importCOC() {

            try {

                const text =

                if (!text) {

                    alert("Chưa có dữ liệu");
                    return;
                }

                const jsonObjects =
                    splitJSONObjects(text);

                if (!jsonObjects.length) {

                    alert("Không tìm thấy JSON hợp lệ");

                for (const json of jsonObjects) {

                );

            }
            catch (e) {

                console.error(e);

                alert(
                    "JSON lỗi:\n" +
                    e.message
                );
            }
        }
